<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINGUAQUIZ</title>
    <link rel="icon" href="img/logo.png" type="image/x-icon" />

    <!-- CDN DE LIBRERÍAS EXTERNAS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;0,700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      xintegrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- ENLACE A LOS ESTILOS LOCALES -->
    <link rel="stylesheet" href="css/estilos.css" />
  </head>

  <body>
    <!-- 1. BARRA DE NAVEGACIÓN SUPERIOR -->
    <nav class="top-menu" id="top-menu">
      <div class="menu-left">
        <img src="img/logo.png" alt="Logo LINGUAQUIZ" class="menu-logo" />
        <span class="app-name">LINGUAQUIZ</span>
      </div>
      <div class="menu-right">
        <button id="perfil-button" class="menu-button">
          Perfil <i class="fa-solid fa-user-circle"></i>
        </button>
        <button id="logout-button" class="logout-button" style="display: none">
          Cerrar Sesión <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </nav>

    <!-- 2. CONTENEDOR PRINCIPAL DE AUTENTICACIÓN (LOGIN Y REGISTRO) -->
    <div id="auth-container">
      <!-- Formulario de Registro -->
      <form id="registro-form" class="main-container" style="display: none;">
        <div class="form-image-container">
          <img
            src="img/logo.png"
            alt="Logo de registro"
            class="form-image"
          />
        </div>
        <h2 class="form_title">REGISTRO</h2>
        <div class="form_inputs">
          <label class="form_label">
            <input
              type="email"
              id="email"
              placeholder=" "
              required
              class="form_input"
            />
            <span class="form_text">
              <i class="fa-solid fa-envelope"></i>Ingresa tu correo
            </span>
          </label>
          <label class="form_label">
            <input
              type="password"
              id="password"
              placeholder=" "
              required
              class="form_input"
            />
            <span class="form_text">
              <i class="fa-solid fa-key"></i>Ingresa tu contraseña
            </span>
          </label>
        </div>
        <button type="submit" class="form_submit">
          <i class="fa-solid fa-user-plus"></i> REGISTRO
        </button>
        <p>
          ¿Ya estás registrado?
          <a class="toggle-link" href="#">Iniciar Sessión</a>
        </p>
      </form>

      <!-- Formulario de Inicio de Sesión -->
      <form id="login-form" class="main-container">
        <div class="form-image-container">
          <img
            src="img/logo.png"
            alt="Logo de inicio de sesión"
            class="form-image"
          />
        </div>
        <h2 class="form_title">INICIÓ DE SESIÓN</h2>
        <div class="form_inputs">
          <label class="form_label">
            <input
              type="email"
              id="login-email"
              placeholder=" "
              class="form_input"
            />
            <span class="form_text">
              <i class="fa-solid fa-envelope"></i>Ingresa tu correo
            </span>
          </label>
          <label class="form_label">
            <input
              type="password"
              id="login-password"
              placeholder=" "
              class="form_input"
            />
            <span class="form_text">
              <i class="fa-solid fa-key"></i>Ingresa tu contraseña
            </span>
          </label>
        </div>
        <button type="submit" class="form_submit">
          <i class="fa-solid fa-right-to-bracket"></i> INICIAR
        </button>
        <p>
          ¿No estás registrado? <a class="toggle-link" href="#">Registro</a>
        </p>
      </form>
    </div>

    <!-- 3. FORMULARIO DE PERFIL -->
    <div id="perfil-container" class="main-container" style="display: none">
      <form id="perfil-form" class="main-container">
        <button type="button" id="close-perfil-button" class="close-button">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <h2 class="form_title">Tu Perfil</h2>
        <div class="perfil-photo-container">
          <img
            id="perfil-photo-preview"
            src="img/silueta.jpg"
            alt="Foto de perfil"
            class="perfil-photo"
          />
          <label for="perfil-photo-upload" class="photo-upload-label">
            <i class="fa-solid fa-camera"></i>
          </label>
          <input
            type="file"
            id="perfil-photo-upload"
            accept="image/*"
            style="display: none"
          />
        </div>
        <div class="form_inputs">
          <label class="form_label">
            <input
              id="nombre-completo"
              class="form_input"
              type="text"
              placeholder=" "
              autocomplete="name"
              required
            />
            <span class="form_text">Nombre completo</span>
          </label>
          <label class="form_label">
            <input
              id="nombre-usuario"
              class="form_input"
              type="text"
              placeholder=" "
              required
            />
            <span class="form_text">Nombre de usuario</span>
          </label>
        </div>
        <button type="submit" class="form_submit">Guardar Cambios</button>
      </form>
    </div>

    <!-- 4. CONTENEDOR DE ALERTAS -->
    <div id="alerta"><p>alerta</p></div>

    <!-- ENLACE AL SCRIPT LOCAL -->
    <script src="js/app.js"></script>
  </body>
</html>
